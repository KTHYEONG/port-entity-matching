forbidden_force_push_flags = ["--force", "-f", "--force-with-lease", "--mirror"]
coarse_risk_pattern = '\b(rm|git\s+push)\b'
forbidden_staged_prefixes = ["scratch/", "tmp/", "docs/specs/", "data/", "artifacts/"]
forbidden_name_globs = [".env", ".env.*", ".envrc", "*.pem", "*.key", "*.csv", "*.parquet", "*.zip", "*.pkl", "*.npy", "*.npz", "*.pt", "*.ckpt", "*.joblib", "*.cbm", "*.feather", "*.duckdb"]
allowed_staged_names = [".gitkeep"]
max_staged_bytes = 2000000
