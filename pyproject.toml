[project]
name = "port-entity-matching"
version = "0.2.0"
description = "Port entity matching and resolution pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.26.4",
    "rapidfuzz==3.14.3",
    "lightgbm==4.6.0",
    "scikit-learn==1.5.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "scratch",
    "logs",
    "results",
    ".pytest_cache",
    ".git",
    ".venv",
    "tools",
    "data",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import, Naming
    "B",    # Bugbear
    "S",    # Bandit (Security)
    "PERF", # Perflint (Performance)
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ASYNC", # flake8-async
    "T20",  # flake8-print
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "S101",   # Allow assert
    "E741",   # Allow ambiguous variable names
    "E501",   # Ignore line length
    "ARG001", # Allow unused function arguments
    "ARG002", # Allow unused method arguments
    "ARG004", # Allow unused static method arguments
    "ARG005", # Allow unused lambda arguments
    "RUF100", # Allow unused noqa directives
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E402", "N802", "N803", "N806", "N813", "N814", "ARG", "I001", "RUF059", "F841", "PT015", "PT018", "B011", "RUF003", "F401", "SIM210", "SIM108", "B009", "SIM300"]
"tools/verify.py" = ["T201", "S607"]
"tools/build_submit.py" = ["T201", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
strict = true
explicit_package_bases = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "scratch",
    "logs",
    "results",
    ".pytest_cache",
    ".git",
    ".venv",
    "^tests/.*/conftest\\.py$",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --import-mode=importlib -m \"not slow\""
pythonpath = [".", "src"]
markers = ["slow: marks slow integration tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
